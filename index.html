<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080a">
  <title>Список задач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <h1 class="brand__title">Список задач</h1>
      </div>
      <p class="app__date" id="today"></p>
    </header>

    <form class="add" id="add-form" autocomplete="off">
      <input
        class="add__input"
        id="new-task"
        type="text"
        placeholder="Что нужно сделать?"
        aria-label="Новая задача"
        maxlength="200"
      >
      <button class="add__button" type="submit" aria-label="Добавить задачу">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <section class="progress" id="progress" hidden>
      <div class="progress__head">
        <span class="progress__label">Выполнено</span>
        <span class="progress__value" id="progress-value">0 / 0</span>
      </div>
      <div class="progress__track" id="progress-track"
           role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="Доля выполненных задач">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
    </section>

    <div class="panel">
      <ul class="tasks" id="task-list" aria-live="polite"></ul>

      <div class="empty" id="empty">
        <span class="empty__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7.5l4 4 8-8"/>
            <path d="M4 17l3 3 4-4"/>
            <path d="M14 16h6"/>
          </svg>
        </span>
        <p class="empty__text" id="empty-text">Пока пусто — добавьте первую задачу.</p>
      </div>
    </div>

    <footer class="app__footer">
      <span class="counter" id="counter">Нет задач</span>

      <div class="filters" role="group" aria-label="Фильтр задач">
        <button class="filters__btn is-active" type="button" data-filter="all">Все</button>
        <button class="filters__btn" type="button" data-filter="active">Активные</button>
        <button class="filters__btn" type="button" data-filter="done">Выполненные</button>
      </div>

      <button class="clear" id="clear-done" type="button">Очистить</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
